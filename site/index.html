<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>AQUA</title>
<style>
  :root {
    --bg: #05121a; --text: #eafaf8; --dim: #4aa8a2; --mute: #7fa9b0;
    --a1: #8ef0d8; --a2: #5ac3e6;
    --glass: rgba(255,255,255,.055); --glass-hi: rgba(255,255,255,.16); --glass-line: rgba(255,255,255,.14);
    --spring: cubic-bezier(.34, 1.45, .64, 1); --ease: cubic-bezier(.22, 1, .36, 1);
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--mono); }
  body { min-height: 100vh; padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 28px); overflow-x: hidden; }

  /* drifting light blobs behind the glass */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: radial-gradient(120% 70% at 50% 0%, #0d2f3d 0%, var(--bg) 65%); }
  .bg i { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55; will-change: transform; }
  .bg i:nth-child(1) { width: 320px; height: 320px; background: #22d3c5; left: -90px; top: 8%; animation: drift1 22s ease-in-out infinite alternate; }
  .bg i:nth-child(2) { width: 280px; height: 280px; background: #3b8df0; right: -100px; top: 38%; animation: drift2 26s ease-in-out infinite alternate; }
  .bg i:nth-child(3) { width: 240px; height: 240px; background: #7be8c8; left: 20%; bottom: -80px; animation: drift3 30s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(120px, 160px) scale(1.2); } }
  @keyframes drift2 { to { transform: translate(-140px, -120px) scale(.85); } }
  @keyframes drift3 { to { transform: translate(100px, -140px) scale(1.15); } }

  /* glass surface */
  .glass {
    position: relative; isolation: isolate;
    background: linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
    -webkit-backdrop-filter: blur(26px) saturate(190%); backdrop-filter: blur(26px) saturate(190%);
    border: 1px solid var(--glass-line);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.28), inset 0 -1px 0 rgba(255,255,255,.04), 0 12px 40px rgba(0,0,0,.35);
  }
  .glass::before { /* specular highlight following the finger */
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1;
    background: radial-gradient(240px circle at var(--mx, 20%) var(--my, 0%), rgba(255,255,255,.16), transparent 60%);
    opacity: var(--glow, .6); transition: opacity .5s var(--ease);
  }

  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; animation: rise .7s var(--ease) both; }
  .logo { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; }
  .logo svg { width: 30px; height: 30px; }
  h1 { margin: 0; font-size: 28px; letter-spacing: .32em; font-weight: 700; text-shadow: 0 0 24px rgba(110,231,207,.45); }

  .row { display: flex; gap: 10px; margin-bottom: 12px; }
  .seg { position: relative; flex: 1; display: flex; padding: 4px; gap: 0; border-radius: 20px; animation: rise .7s .05s var(--ease) both; }
  .seg { touch-action: none; user-select: none; -webkit-user-select: none; }
  .seg .thumb {
    position: absolute; top: 4px; bottom: 4px; left: 0; width: 0; border-radius: 17px; z-index: 2; pointer-events: none;
    --x: 0px; --y: 0px; --sx: 1; --sy: 1;
    transform: translate(var(--x), var(--y)) scale(var(--sx), var(--sy));
    background: linear-gradient(180deg, rgba(255,255,255,.30) 0%, rgba(255,255,255,.07) 55%, rgba(120,225,235,.16) 100%);
    -webkit-backdrop-filter: blur(1.5px) saturate(230%) brightness(1.45) contrast(1.05);
    backdrop-filter: blur(1.5px) saturate(230%) brightness(1.45) contrast(1.05);
    border: 1px solid rgba(255,255,255,.38);
    box-shadow:
      inset 0 1.5px 1px rgba(255,255,255,.75),
      inset 0 -8px 14px rgba(90,200,235,.28),
      inset 0 0 18px rgba(255,255,255,.14),
      0 6px 20px rgba(0,0,0,.38),
      0 0 26px rgba(90,195,230,.28);
    transition: transform .55s var(--spring), width .6s var(--spring), box-shadow .4s var(--ease), background .4s var(--ease);
  }
  .seg .thumb::after { /* curved top glint */
    content: ""; position: absolute; left: 12%; right: 12%; top: 2px; height: 38%; border-radius: 999px;
    background: linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0));
    opacity: .7;
  }
  .seg.drag .thumb { transition: width .3s var(--spring), box-shadow .3s var(--ease); }
  .seg.press .thumb { --sy: 1.14; box-shadow: inset 0 1.5px 1px rgba(255,255,255,.85), inset 0 -8px 14px rgba(90,200,235,.35), inset 0 0 22px rgba(255,255,255,.2), 0 10px 28px rgba(0,0,0,.4), 0 0 36px rgba(110,231,207,.45); }
  .seg button { position: relative; z-index: 1; touch-action: none; flex: 1; border: 0; border-radius: 16px; padding: 12px 4px; background: transparent; color: var(--mute); font: 500 12px var(--mono); letter-spacing: .02em; transition: color .3s var(--ease), transform .3s var(--spring); }
  .seg button.on { color: #fff; font-weight: 700; text-shadow: 0 0 14px rgba(142,240,216,.8); }
  

  .go {
    display: inline-flex; align-items: center; justify-content: center; gap: 12px; border: 0; border-radius: 20px; padding: 15px 22px;
    background: linear-gradient(135deg, var(--a1), var(--a2)); color: #04222a; font: 700 17px var(--mono);
    box-shadow: 0 0 28px rgba(90,195,230,.4), inset 0 1px 0 rgba(255,255,255,.55);
    transition: transform .4s var(--spring), box-shadow .4s var(--ease), opacity .3s; animation: rise .7s .1s var(--ease) both;
  }
  .go:active { transform: scale(.93); box-shadow: 0 0 14px rgba(90,195,230,.3), inset 0 1px 0 rgba(255,255,255,.4); }
  .go:disabled { opacity: .6; }
  .go svg { width: 14px; height: 14px; }
  .go.ghost { background: linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,.03)); color: var(--a1); border: 1px solid var(--glass-line); box-shadow: inset 0 1px 0 rgba(255,255,255,.28); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
  .go.busy svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .card { border-radius: 26px; overflow: hidden; margin-bottom: 18px; animation: rise .8s var(--ease) both; }
  .card:nth-of-type(1) { animation-delay: .15s; } .card:nth-of-type(2) { animation-delay: .25s; }
  .head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: rgba(255,255,255,.04); border-bottom: 1px solid var(--glass-line); }
  .head small { display: block; color: var(--dim); font-size: 12px; letter-spacing: .24em; font-weight: 700; margin-bottom: 6px; }
  .head b { font-size: 21px; font-weight: 700; }
  .tools { display: flex; gap: 6px; }
  .tools button { width: 42px; height: 42px; border: 0; border-radius: 14px; background: transparent; color: #d6eef0; display: grid; place-items: center; transition: transform .35s var(--spring), background .3s var(--ease); }
  .tools button:active { transform: scale(.86); background: rgba(255,255,255,.14); }
  .tools svg { width: 22px; height: 22px; }
  textarea { display: block; width: 100%; min-height: 300px; resize: vertical; border: 0; outline: 0; padding: 16px 20px; background: transparent; color: var(--text); font: 14px/1.5 var(--mono); white-space: pre; overflow: auto; tab-size: 2; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  textarea::placeholder { color: rgba(160,210,215,.28); }
  #out.fresh { animation: fadein .6s var(--ease); }
  .foot { display: flex; justify-content: space-between; gap: 12px; padding: 14px 20px; border-top: 1px solid var(--glass-line); color: var(--mute); font-size: 14px; letter-spacing: .06em; background: rgba(255,255,255,.025); }
  .status { min-height: 20px; margin: 0 2px 14px; font-size: 13px; color: var(--mute); transition: color .3s; }
  .status.pop { animation: pop .45s var(--spring); }
  .status.err { color: #ff9a9a; } .status.ok { color: var(--a1); }
  input[type=file] { display: none; }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translate(-50%, 24px) scale(.9); padding: 11px 18px; border-radius: 18px; font-size: 13px; opacity: 0; transition: opacity .3s var(--ease), transform .5s var(--spring); pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

  @keyframes rise { from { opacity: 0; transform: translateY(22px) scale(.98); } to { opacity: 1; transform: none; } }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: translateY(4px) scale(.98); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition-duration: .01s !important; } }
</style>
</head>
<body>
  <div class="bg"><i></i><i></i><i></i></div>
  <div class="brand">
    <div class="logo glass">
      <svg viewBox="0 0 32 32" fill="none" stroke="#6ee7cf" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
        <path d="M16 3 27 9.5v13L16 29 5 22.5v-13z"/><path d="M10.5 21 16 10l5.5 11M12.5 17.5h7"/>
      </svg>
    </div>
    <h1>AQUA</h1>
  </div>

  <div class="row">
    <div class="seg glass" id="type">
      <span class="thumb"></span>
      <button data-v="auto" class="on">Auto</button>
      <button data-v="prometheus">Prometheus</button>
      <button data-v="clyde">Clyde</button>
      <button data-v="luaobf">LuaObf</button>
      <button data-v="ironveil">Ironveil</button>
    </div>
  </div>

  <div class="row" style="gap:10px;margin-bottom:12px">
    <button class="go" id="go" style="margin:0">

    </button>
    <button class="go ghost" id="detect" style="margin:0">Detect</button>
  </div>
  <div class="status" id="status"></div>

  <section class="card glass">
    <div class="head">
      <div><small>01 / SOURCE</small><b>Input</b></div>
      <div class="tools">
        <button id="paste" aria-label="Paste"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg></button>
        <button id="open" aria-label="Open file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
        <button id="clear" aria-label="Clear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg></button>
      </div>
    </div>
    <textarea id="src" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="-- paste obfuscated Lua/Luau code"></textarea>
    <div class="foot"><span id="inSize">0 B</span><span>Lua 5.1 + Luau extensions</span></div>
  </section>

  <section class="card glass">
    <div class="head">
      <div><small>02 / RESULT</small><b>Output</b></div>
      <div class="tools">
        <button id="copy" aria-label="Copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button>
        <button id="share" aria-label="Share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7.5 7.5 12 3l4.5 4.5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></button>
      </div>
    </div>
    <textarea id="out" spellcheck="false" readonly placeholder="-- result will appear here"></textarea>
    <div class="foot"><span id="outSize">0 B</span><span id="outInfo">—</span></div>
  </section>

  <input type="file" id="file" accept=".lua,.luau,.txt,.luac,text/plain,application/octet-stream">
  <div class="toast glass" id="toast"></div>

  <script src="deob.bundle.js"></script>
  <script>
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    var src = $('src'), out = $('out'), statusEl = $('status'), mode = 'auto';
    var NAMES = { prometheus: 'Prometheus', clyde: 'Clyde', luaobf: 'LuaObfuscator', ironveil: 'Ironveil', generic: 'Cleanup' };

    function size(n) { return n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(2) + ' MB'; }
    function bytes(s) { try { return new Blob([s]).size; } catch (e) { return s.length; } }
    function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove('show'); }, 1500); }
    function setStatus(t, cls) { statusEl.textContent = t || ''; statusEl.className = 'status ' + (cls || ''); void statusEl.offsetWidth; if (t) statusEl.classList.add('pop'); }
    function updIn() { $('inSize').textContent = size(bytes(src.value)); try { localStorage.setItem('aqua.src', src.value); } catch (e) {} }
    function updOut() { $('outSize').textContent = size(bytes(out.value)); }

    try { src.value = localStorage.getItem('aqua.src') || ''; } catch (e) {}
    updIn();
    src.addEventListener('input', updIn);

    var seg = $('type'), thumb = seg.querySelector('.thumb'), segBtns = Array.prototype.slice.call(seg.querySelectorAll('button'));
    var curX = 0, curW = 0, dragging = false, moved = false, grab = 0;
    function place(btn, jelly) {
      curW = btn.offsetWidth; curX = btn.offsetLeft;
      thumb.style.width = curW + 'px';
      thumb.style.setProperty('--x', curX + 'px');
      if (jelly) { // brief squash-and-stretch as the glass slides
        thumb.style.setProperty('--sx', 1.16); thumb.style.setProperty('--sy', .9);
        setTimeout(function () { thumb.style.setProperty('--sx', 1); thumb.style.setProperty('--sy', 1); }, 170);
      }
    }
    function select(btn, jelly) {
      segBtns.forEach(function (x) { x.classList.toggle('on', x === btn); });
      mode = btn.dataset.v; place(btn, jelly);
    }
    function moveThumb() { var on = seg.querySelector('button.on'); if (on) place(on, false); }
    function nearest(cx) { // button whose centre is closest to cx (px inside seg)
      var best = segBtns[0], bd = 1e9;
      segBtns.forEach(function (b) { var d = Math.abs(b.offsetLeft + b.offsetWidth / 2 - cx); if (d < bd) { bd = d; best = b; } });
      return best;
    }
    function relX(e) { var r = seg.getBoundingClientRect(); return e.clientX - r.left; }
    seg.addEventListener('pointerdown', function (e) {
      dragging = true; moved = false; seg.classList.add('press');
      var on = seg.querySelector('button.on'); grab = Math.min(Math.max(relX(e) - (on.offsetLeft + on.offsetWidth / 2), -on.offsetWidth / 2), on.offsetWidth / 2);
      grab = relX(e) - (on.offsetLeft + on.offsetWidth / 2) > on.offsetWidth / 2 || relX(e) - (on.offsetLeft + on.offsetWidth / 2) < -on.offsetWidth / 2 ? 0 : grab;
      try { seg.setPointerCapture(e.pointerId); } catch (x) {}
    });
    var lastX = 0;
    seg.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      lastX = relX(e);
      var rr = seg.getBoundingClientRect(), dy = e.clientY - (rr.top + rr.height / 2), ady = Math.abs(dy);
      var pull = Math.min(ady, 140), ty = Math.sign(dy) * Math.pow(pull, .8) * .6;
      thumb.style.setProperty('--y', ty.toFixed(1) + 'px');
      thumb.style.setProperty('--sy', (1.14 + Math.min(pull / 120, .55)).toFixed(3));
      thumb.style.setProperty('--sx', (1 + Math.min(pull / 260, .25)).toFixed(3));
      var x = relX(e) - grab - curW / 2, min = segBtns[0].offsetLeft, max = segBtns[segBtns.length - 1].offsetLeft + segBtns[segBtns.length - 1].offsetWidth - curW;
      x = Math.max(min, Math.min(max, x));
      if (Math.abs(x - curX) > 3) { moved = true; seg.classList.add('drag'); }
      if (moved) {
        thumb.style.setProperty('--x', x + 'px');
        var b = nearest(x + curW / 2);
        if (!b.classList.contains('on')) { segBtns.forEach(function (z) { z.classList.toggle('on', z === b); }); mode = b.dataset.v; if (navigator.vibrate) try { navigator.vibrate(6); } catch (e2) {} }
      }
    });
    function release(e) {
      if (!dragging) return; dragging = false;
      var wasDrag = moved;
      seg.classList.remove('press'); seg.classList.remove('drag');
      thumb.style.setProperty('--y', '0px'); thumb.style.setProperty('--sy', 1); thumb.style.setProperty('--sx', 1);
      var b = wasDrag ? seg.querySelector('button.on') : nearest(e && e.clientX != null ? relX(e) : lastX);
      var changed = !b.classList.contains('on') || wasDrag;
      select(b, changed);

    seg.addEventListener('pointerup', release);
    seg.addEventListener('pointercancel', function (e) { dragging = false; thumb.style.setProperty('--y','0px'); thumb.style.setProperty('--sy',1); thumb.style.setProperty('--sx',1); seg.classList.remove('press'); seg.classList.remove('drag'); moveThumb(); });
    segBtns.forEach(function (b) { b.addEventListener('click', function () { if (!b.classList.contains('on')) select(b, true); }); });
    window.addEventListener('resize', moveThumb);
    window.addEventListener('load', moveThumb);
    requestAnimationFrame(moveThumb);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveThumb);

    // specular highlight follows the finger over glass surfaces
    document.querySelectorAll('.glass').forEach(function (el) {
      var mv = function (e) {
        var t = e.touches ? e.touches[0] : e, r = el.getBoundingClientRect();
        el.style.setProperty('--mx', (t.clientX - r.left) + 'px'); el.style.setProperty('--my', (t.clientY - r.top) + 'px'); el.style.setProperty('--glow', 1);
      };
      var end = function () { el.style.setProperty('--glow', .6); };
      el.addEventListener('pointermove', mv); el.addEventListener('touchmove', mv, { passive: true });
      el.addEventListener('pointerup', end); el.addEventListener('touchend', end); el.addEventListener('pointerleave', end);
    });

    // ---- engines: each returns {code, info} or throws ----
    var engines = {
      generic: function (s) {
        var c = s, n = 0, prev;
        function esc(m, d, h) { var ch = d !== undefined ? +d : parseInt(h, 16); return ch >= 32 && ch < 127 && ch !== 34 && ch !== 39 && ch !== 92 && ch !== 91 && ch !== 93 ? String.fromCharCode(ch) : m; }
        c = c.replace(/"((?:[^"\\\n]|\\.)*)"|'((?:[^'\\\n]|\\.)*)'/g, function (m) {
          var r = m.replace(/\\(\d{1,3})|\\x([0-9a-fA-F]{2})/g, esc); if (r !== m) n++; return r; });
        for (var i = 0; i < 5; i++) { prev = c;
          c = c.replace(/\bloadstring\s*\(\s*"((?:[^"\\\n]|\\.)*)"\s*\)\s*\(\s*\)/g, function (m, body) { n++; return body.replace(/\\n/g, '\n').replace(/\\"/g, '"').replace(/\\\\/g, '\\'); });
          if (c === prev) break; }
        if (!n) throw new Error('nothing to clean');
        try { c = Deob.ironbeaut.Beautify(c, { RenameVariables: false, RenameGlobals: false }); } catch (e) {}
        return { code: c, info: 'Generic cleanup' };
      },
      prometheus: function (s) {
        var r = Deob.prometheus.deobfuscate(s, { name: 'input' });
        var w = r.warnings && r.warnings.length ? ' · ' + r.warnings.length + ' warn' : '';
        return { code: r.code, info: 'Prometheus' + w };
      },
      clyde: function (s) {
        var d = Deob.clyde.detectClyde(s);
        if (!d || !d.isClyde) throw new Error('doesn\'t look like Clyde');
        var r = Deob.clyde.deobfuscateClyde(s);
        if (!r.success) {

      },
      ironveil: function (s) {

        var r = Deob.ironveil.deobfuscate(s);
        try { r = Deob.ironbeaut.Beautify(r, { RenameVariables: false, RenameGlobals: false }); } catch (e) {}
        return { code: '-- deobfuscated by LeakD discord.gg/qteAQmfJmP\n\n' + r.replace(/^\s+/, ''), info: 'Ironveil v1' };
      },
      luaobf: function (s) {
        var r;
        try {
          var q = Deob.lsdluaobf.deobfuscateLuaObfuscator(s, {});
          var qc = q && (q.code || q.output || (typeof q === 'string' ? q : ''));
          var qs = q && q.stats || {};
          if (qc && qc.length > 20 && (qs.vmPayloads || qs.decodedStrings || qs.removedDecoder || qs.removedBanner || (qs.decoders && qs.decoders.length))) return { code: qc, info: 'LuaObfuscator' };
        } catch (e0) {}
        try { r = Deob.luaobf.deobf(s, { log: false }); }
        catch (e) { if (/^det:/.test(e.message)) throw new Error('doesn\'t look like LuaObfuscator'); throw e; }
        var code = r.reconstructed || r.lua;
        if (!code) throw new Error('LuaObfuscator: empty result');
        return { code: code, info: 'LuaObfuscator' + (r.detection && r.detection.family ? ' · ' + r.detection.family.replace('luaobfuscator-', '') : '') };
      }
    };


    // ---- detect ----
    var UNSUPPORTED = [
      { name: 'Luraph', re: /protected using Luraph|lura\.ph|Luraph Obfuscator/i },
      { name: 'MoonSec V3', re: /protected with MoonSec|MoonSec V3/i },
      { name: 'MoonVeil', re: /MoonVeil Obfuscator|moonveil\.cc/i },
      { name: '77fuscator', re: /77FUS\||77fuscator/i },
      { name: 'IronBrew 3', re: /ironbrew3/i },
      { name: 'IronBrew 1', re: /generated using ironbrew1/i },
      { name: 'IronBrew 2', re: /IronBrew|Iron Brew|^local \w=string\.byte;local \w=string\.char;local \w=string\.sub;local \w=table\.concat;local \w=table\.insert;local \w=math\.ldexp;local \w=getfenv or/i },
      { name: 'Hercules', re: /Obfuscated by Hercules|hercules-obfuscator/i },
      { name: 'PSU', re: /obfuscated using PSU|psu\.dev/i },
      { name: 'Boronide', re: /herrtt'?s obf|Boronide/i },
      { name: 'Synapse Xen', re: /Synapse Xen|SynapseXen_/i },
      { name: 'wYnFuscate', re: /wYnFuscate|wynfuscate\.com/i },
      { name: 'Clyde v3 (register VM)', re: /^\s*return\s*\(function\(\.\.\.\)[\s\S]{0,400}bit32\.byteswap[\s\S]{0,400}\[=\[/ }
    ];

    function detect(s) {
      var found = [];
      try { var d = Deob.clyde.detectClyde(s); if (d && d.isClyde) found.push({ id: 'clyde', name: 'Clyde', ok: true, score: d.score || 1 }); } catch (e) {}
      try {
        var ch = null; try { ch = Deob.prometheus.parse(s, { name: 'input' }); } catch (e) {}
        var r = Deob.prometheus.identify(s, ch);
        if (r && r.prometheus) found.push({ id: 'prometheus', name: 'Prometheus', ok: true });
      } catch (e) {}
      if (/obfuscated using ironveil/i.test(s)) found.push({ id: 'ironveil', name: 'Ironveil', ok: true });
      try { var l = Deob.luaobfio.det(s); if (l && l.matched) found.push({ id: 'luaobf', name: 'LuaObfuscator', ok: true, extra: (l.family || '').replace('luaobfuscator-', '') }); } catch (e) {}
      UNSUPPORTED.forEach(function (u) { if (u.re.test(s)) found.push({ id: null, name: u.name, ok: false }); });
      return found;
    }
    function describe(found) {
      if (!found.length) return 'Obfuscator not recognized (supported: Prometheus, Clyde, LuaObfuscator, Ironveil)';
      return 'Detected: ' + found.map(function (f) { return f.name + (f.extra ? ' (' + f.extra + ')' : '') + (f.ok ? '' : ' — not supported in this app'); }).join(', ');
    }

    function u8(t) { try { return unescape(encodeURIComponent(t)); } catch (e) { return t; } }
    function un8(t) { try { return decodeURIComponent(escape(t)); } catch (e) { return t; } }
    function run() {
      var s = src.value;
      if (!s.trim()) { setStatus('Paste code or open a file', 'err'); return; }
      var order;
      if (mode === 'auto') {
        var fd = detect(s);
        var sup = fd.filter(function (f) { return f.ok; }).map(function (f) { return f.id; });
        if (!sup.length && !fd.length) sup = ['luaobf', 'prometheus', 'clyde', 'ironveil', 'generic'];
        if (!sup.length) {
          out.value = ''; updOut(); $('outInfo').textContent = '—';
          setStatus(describe(fd), 'err'); return;
        }
        order = sup;
      } else order = [mode];
      var errors = [], res = null, partial = '';
      for (var i = 0; i < order.length; i++) {
        try { res = engines[order[i]](u8(s)); if (res && res.code) { res.code = un8(res.code).replace(/^(\s*--[^\n]*(deobf|Deоbf|LeakD|VX)[^\n]*\n)+/i, ''); res.code = '-- ayo deobf by aqua deobf ngga\n\n' + res.code.replace(/^\s+/, ''); } break; }
        catch (e) { errors.push(NAMES[order[i]] + ': ' + String(e && e.message || e).replace(/^unsupported Prometheus payload:.*/, 'doesn\'t look like Prometheus').split('\n')[0].slice(0, 110)); if (e && e.partial) partial = e.partial; }
      }
      if (res) {
        out.value = res.code; updOut(); out.classList.remove('fresh'); void out.offsetWidth; out.classList.add('fresh');
        $('outInfo').textContent = res.info;
        setStatus('Done · ' + res.info, 'ok');
        out.scrollTop = 0;
      } else {
        out.value = partial ? '-- could not fully deobfuscate' + partial : ''; updOut();
        $('outInfo').textContent = '—';
        setStatus(mode === 'auto' ? 'Could not identify the obfuscator. ' + errors.join(' | ') : errors[0], 'err');
      }
    }

    $('go').addEventListener('click', function () {
      var b = $('go'); b.disabled = true; b.classList.add('busy'); setStatus('Working…');
      // let the UI repaint before the heavy work
      requestAnimationFrame(function () { setTimeout(function () {
        try { run(); } catch (e) { setStatus('Error: ' + e.message, 'err'); }
        b.disabled = false; b.classList.remove('busy');
      }, 30); });
    });

    $('detect').addEventListener('click', function () {
      var s = src.value; if (!s.trim()) { setStatus('Paste code or open a file', 'err'); return; }
      setStatus('Detecting…');
      requestAnimationFrame(function () { setTimeout(function () {
        try { var f = detect(s); setStatus(describe(f), f.some(function (x) { return x.ok; }) ? 'ok' : 'err'); }
        catch (e) { setStatus('Error: ' + e.message, 'err'); }
      }, 30); });
    });

    $('paste').addEventListener('click', function () {
      if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText().then(function (t) { src.value = t; updIn(); toast('Pasted'); }, function () { toast('Paste manually: long-press the field'); src.focus(); });
      } else { toast('Paste manually: long-press the field'); src.focus(); }
    });
    $('open').addEventListener('click', function () { $('file').click(); });
    $('file').addEventListener('change', function () {
      var f = this.files && this.files[0]; if (!f) return;
      var rd = new FileReader();
      rd.onload = function () { src.value = rd.result; updIn(); toast(f.name); };
      rd.readAsText(f); this.value = '';
    });
    $('clear').addEventListener('click', function () { src.value = ''; out.value = ''; updIn(); updOut(); setStatus(''); $('outInfo').textContent = '—'; });

    function copyText(t) {
      var done = function () { toast('Copied'); };
      var fallback = function () {
        var ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta);
        ta.select(); ta.setSelectionRange(0, t.length); try { document.execCommand('copy'); done(); } catch (e) { toast('Failed'); } document.body.removeChild(ta);
      };
      if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) navigator.clipboard.writeText(t).then(done, fallback); else fallback();
    }
    $('copy').addEventListener('click', function () { if (out.value) copyText(out.value); else toast('Empty'); });
    $('share').addEventListener('click', function () {
      if (!out.value) { toast('Empty'); return; }
      var t = out.value;
      if (navigator.share) {
        try {
          var file = new File([t], 'deobfuscated.lua', { type: 'text/plain' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file] }).catch(function () {}); return; }
        } catch (e) {}
        navigator.share({ text: t }).catch(function () {});
      } else { copyText(t); }
    });
  })();
  </script>
</body>
